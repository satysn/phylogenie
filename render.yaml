services:
  - type: web
    name: phylogenie
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NCBI_EMAIL
        sync: false
      - key: NCBI_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO

    # Render's free plan has no persistent disk — job history (SQLite db +
    # cached PDFs) resets on every restart/redeploy, which is fine for
    # letting people run and view one analysis at a time.
    #
    # To keep job history across restarts, upgrade `plan` to `starter` (or
    # higher) and uncomment the block below. Both OUTPUT_DIR and DB_PATH
    # must live on the mounted disk, or only one of them will persist:
    #
    # envVars:
    #   - key: OUTPUT_DIR
    #     value: /var/data/outputs
    #   - key: DB_PATH
    #     value: /var/data/phylogenie.db
    # disk:
    #   name: phylogenie-data
    #   mountPath: /var/data
    #   sizeGB: 1
